<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pièce Fenua">
  <!-- Engrenage (la pièce) -->
  <g fill="#0b4f6c">
    <circle cx="60" cy="60" r="44"/>
    <g id="dent"><rect x="53" y="4" width="14" height="16" rx="3"/></g>
    <use href="#dent" transform="rotate(45 60 60)"/>
    <use href="#dent" transform="rotate(90 60 60)"/>
    <use href="#dent" transform="rotate(135 60 60)"/>
    <use href="#dent" transform="rotate(180 60 60)"/>
    <use href="#dent" transform="rotate(225 60 60)"/>
    <use href="#dent" transform="rotate(270 60 60)"/>
    <use href="#dent" transform="rotate(315 60 60)"/>
  </g>
  <!-- Anneau motif vague -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#7fc8de" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Fleur de tiare (5 pétales) -->
  <g fill="#ffffff">
    <ellipse id="p" cx="60" cy="42" rx="8" ry="16"/>
    <use href="#p" transform="rotate(72 60 60)"/>
    <use href="#p" transform="rotate(144 60 60)"/>
    <use href="#p" transform="rotate(216 60 60)"/>
    <use href="#p" transform="rotate(288 60 60)"/>
  </g>
  <circle cx="60" cy="60" r="6" fill="#f2b632"/>
</svg>
